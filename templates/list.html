<form class="filter" action="{{root}}" method="get" hx-get="{{root}}" hx-target="#ticket-rows" hx-trigger="input delay:300ms, submit" hx-push-url="true">
	<label>Search
		<input type="search" name="q" value="{{query}}">
	</label>
{{#inputs}}
{{#select}}
	<label>{{label}}
		<select name="{{name}}">
		{{#groups}}
		{{#grouped}}
			<optgroup label="{{group_label}}">
		{{/grouped}}
		{{#choices}}
			<option value="{{value}}"{{#selected}} selected{{/selected}}>{{label}}</option>
		{{/choices}}
		{{#grouped}}
			</optgroup>
		{{/grouped}}
		{{/groups}}
		</select>
	</label>
{{/select}}
{{#text_input}}
	<label>{{label}}
		<input type="search" name="{{name}}" value="{{text}}" list="known-{{name}}">
	</label>
	<datalist id="known-{{name}}">
	{{#known}}
		<option value="{{.}}">
	{{/known}}
	</datalist>
{{/text_input}}
{{/inputs}}
	<button type="submit">Filter</button>
</form>
<table class="tickets">
	<thead>
		<tr>
			<th class="id">#</th>{{#columns}}<th class="field field-{{name}}">{{label}}</th>{{/columns}}<th class="title">Title</th>
		</tr>
	</thead>
	<tbody id="ticket-rows">
{{> ticket-rows.html}}
	</tbody>
</table>
